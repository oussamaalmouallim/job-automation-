# Intégration continue : lint, tests et build à chaque push et à chaque pull request.
# Aucun appel réel à OpenRouter, n8n ou Google : tout est simulé dans les tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Vraie base PostgreSQL pour les tests d'intégration (test/postgres.test.js), dans un schéma « test ».
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: linkedai
          POSTGRES_PASSWORD: linkedai
          POSTGRES_DB: linkedai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U linkedai -d linkedai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL_TEST: postgresql://linkedai:linkedai@localhost:5433/linkedai?schema=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 au moins : la reprise SQLite utilise le module node:sqlite.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Synchro du design (design.md, palette.md ↔ code)
        working-directory: .
        run: node .claude/skills/cloneme/scripts/verifier-synchro.mjs frontend

  e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: e2e/rapport
          retention-days: 14
